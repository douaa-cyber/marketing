name: Keep Render Backend Awake
on:
  schedule:
    - cron: '*/10 * * * *'  # S'exécute toutes les 10 minutes
  workflow_dispatch: {}     # Permet de lancer le ping manuellement

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render backend health endpoint
        run: |
          # ⚠️ REMPLACEZ CETTE URL PAR VOTRE URL RENDER DE PRODUCTION
          curl -fsS https://marketingapp-9zxk.onrender.com/test || true
